function shadeColor(color, percent) {
    var num = parseInt(color.replace('#', ''), 16);
    var amt = Math.round(2.55 * percent);
    var R = Math.min(255, Math.max(0, (num >> 16) + amt));
    var G = Math.min(255, Math.max(0, (num >> 8 & 0x00FF) + amt));
    var B = Math.min(255, Math.max(0, (num & 0x0000FF) + amt));
    return '#' + (0x1000000 + R*0x10000 + G*0x100 + B).toString(16).slice(1);
}

// 保存所有边界圆和标签
var bounds = [];
var labels = [];
var boundsVisible = true;
var labelsVisible = true;

// 创建片区边界
var layerGroup = new AMap.LayerGroup();
sectors.forEach(function(sec, i) {
    var baseColor = adminBase[sec.admin] || '#999';
    var fillColor = shadeColor(baseColor, 20);  // 浅色填充

    // 圆
    var circle = new AMap.Circle({
        center: sec.center,
        radius: sec.radius,
        fillOpacity: 0.15,
        fillColor: fillColor,
        strokeColor: baseColor,
        strokeWeight: 2,
        strokeOpacity: 0.6,
        strokeStyle: 'dashed',
        zIndex: 10,
    });
    circle.setExtData({sector: sec.name, admin: sec.admin});
    bounds.push(circle);
    circle.setMap(map);

    // 边界上的标签
    var label = new AMap.Text({
        text: sec.name,
        position: [sec.center[0] + 0.005, sec.center[1] + 0.003],
        style: {
            'font-size': '11px',
            'color': baseColor,
            'background': 'rgba(255,255,255,0.85)',
            'padding': '2px 6px',
            'border-radius': '3px',
            'border': '1px solid ' + baseColor,
            'white-space': 'nowrap',
        }
    });
    labels.push(label);
    label.setMap(map);
});

// 创建标记点（用圆形标记代替默认水滴，更快识别）
var markerLayer = new AMap.LayerGroup();
markersData.forEach(function(p) {
    var baseColor = adminBase[p.admin] || '#999';
    // 找对应片区
    var sec = sectors.find(function(s) { return s.name === p.sector; });
    var idx = sec ? sectors.indexOf(sec) : 0;
    var color = shadeColor(baseColor, -idx * 3);

    var marker = new AMap.CircleMarker({
        center: [p.lng, p.lat],
        radius: 8,
        fillColor: color,
        fillOpacity: 0.9,
        strokeColor: '#fff',
        strokeWeight: 2,
        strokeOpacity: 1,
        zIndex: 100,
        cursor: 'pointer',
    });

    var content = '<div style="max-width:260px;">' +
        '<b style="font-size:14px;">' + p.name + '</b><br>' +
        '<span style="color:#666;font-size:11px;"> 管理员: ' + p.admin + '</span><br>' +
        '<span style="color:#888;font-size:11px;"> 片区: ' + p.sector + '</span><br>' +
        '<span style="color:#888;font-size:11px;"> 地址: ' + (p.addr || '') + '</span>' +
        '</div>';

    marker.on('click', function() {
        var info = new AMap.InfoWindow({
            content: content,
            offset: new AMap.Pixel(0, -20),
        });
        info.open(map, [p.lng, p.lat]);
    });

    marker.setMap(map);
});

// 切换边界
function toggleBoundary() {
    boundsVisible = !boundsVisible;
    bounds.forEach(function(b) { b.setMap(boundsVisible ? map : null); });
    labels.forEach(function(l) { l.setMap(labelsVisible && boundsVisible ? map : null); });
}

// 生成图例
var legendHtml = '<h3> 惠和资产片区划分</h3>';
legendHtml += '<div style="margin-bottom:4px;color:#666;">共 <b>' + sectors.length + '</b> 个片区 &nbsp;|&nbsp; <b>' + markersData.length + '</b> 个资产点</div>';
var admins = ['陈晓芳', '李美清', '谢德胜', '暂无'];
admins.forEach(function(a) {
    var secs = sectors.filter(function(s) { return s.admin === a; });
    if (secs.length === 0) return;
    var color = adminBase[a] || '#999';
    legendHtml += '<div style="margin-top:6px;font-weight:bold;color:' + color + ';">' + a + '（' + secs.length + '片区）</div>';
    secs.forEach(function(s) {
        var sc = shadeColor(color, -secs.indexOf(s) * 3);
        legendHtml += '<div class="legend-row" onclick="map.setCenter([' + s.center[0] + ',' + s.center[1] + ']);map.setZoom(15);">' +
            '<span class="dot" style="background:' + sc + ';"></span>' +
            s.name + '<span class="count">' + s.count + '项</span></div>';
    });
});
document.getElementById('legend').innerHTML = legendHtml;

// 添加比例尺和缩放控件
map.addControl(new AMap.Scale());
map.addControl(new AMap.ToolBar());
