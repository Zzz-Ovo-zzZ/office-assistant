pts.forEach(function(p){

  // 标记点（稍大圆形，带白色边框）
  var m=new AMap.CircleMarker({center:[p.lng,p.lat],radius:8,fillColor:cl,fillOpacity:.9,strokeColor:'#fff',strokeWeight:2,zIndex:100,cursor:'pointer'});
